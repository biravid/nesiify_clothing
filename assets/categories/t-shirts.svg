<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="grad_tshirts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE9"/>
      <stop offset="100%" stop-color="#FAF7F2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#grad_tshirts)"/>
  <rect x="30" y="30" width="540" height="690" fill="none" stroke="#E2DCCF" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Subtle organic background shape -->
  <circle cx="300" cy="300" r="140" fill="#616438" opacity="0.06"/>
  <circle cx="300" cy="300" r="110" fill="none" stroke="#616438" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.3"/>
  
  <!-- Kids T-Shirt Line Icon -->
  <g transform="translate(300, 290)" stroke="#1E2015" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- T-Shirt silhouette -->
    <path d="M -45 -70 C -25 -55 25 -55 45 -70 L 95 -30 L 70 15 L 45 0 L 45 75 L -45 75 L -45 0 L -70 15 L -95 -30 Z" fill="#FAF6EB" fill-opacity="0.85"/>
    <!-- Collar curve -->
    <path d="M -22 -62 C -10 -45 10 -45 22 -62"/>
    <!-- Cute smile badge on chest -->
    <path d="M -12 -5 C 0 10 12 10 16 -2" stroke="#616438" stroke-width="2.5"/>
    <circle cx="-6" cy="-14" r="2.5" fill="#616438" stroke="none"/>
    <circle cx="8" cy="-14" r="2.5" fill="#616438" stroke="none"/>
  </g>

  <g transform="translate(300, 480)" text-anchor="middle">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="30" font-weight="700" fill="#1E2015" letter-spacing="1">T-Shirts</text>
    <text x="0" y="34" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#65675E" letter-spacing="2">DAILY WEAR &bull; SOFT COTTON</text>
    <text x="0" y="70" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#616438" letter-spacing="2.5">SHOP T-SHIRTS &rarr;</text>
  </g>
</svg>